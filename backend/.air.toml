root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = ""
  args = ["-config", "config.yaml"] # Example: passing a config file as an argument
  env = []
  delay = 1000 # ms
  exclude_dir = ["tmp", "vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js", "yaml", "toml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[run]
  cmd = "./tmp/main" # The command to execute the built binary
  args = []
  env = []
  delay = 0 # ms

[log]
  time = false

[misc]
  clean_on_exit = true